server:
  port: 8083

spring:
  application:
    name: taxonomy

  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_taxonomy
    username: nexus
    password: nexus
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

integration:
  attribute:
    base-url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
