server:
  port: 8085

spring:
  application:
    name: media
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_media
    username: nexus
    password: nexus
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

integration:
  catalog:
    base-url: http://localhost:8081

storage:
  bucket: nexus-media
  public-base-url: http://localhost:9000
  upload-url-ttl-seconds: 900

management:
  endpoints:
    web:
      exposure:
        include: health,info
